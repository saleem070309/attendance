<!DOCTYPE html>
<html class="dark" dir="rtl" lang="ar">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#020a2f">
    <title>دخول | نظام الحضور الذكي</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link href="styles/liquid-glass.css" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7aafff",
                        "on-primary": "#002e5d",
                        "background": "#020a2f",
                        "surface": "#081542"
                    },
                    fontFamily: {
                        sans: ['Tajawal', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #020a2f;
            overflow-x: hidden;
        }

        /* Physics-based Tab Bar */
        .tab-indicator {
            position: absolute;
            top: 4px;
            bottom: 4px;
            right: 4px;
            width: calc(50% - 6px);
            border-radius: 12px;
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1.15);
            z-index: 1;
        }

        .indicator-teacher {
            transform: translateX(0);
            background: linear-gradient(135deg, #7aafff, #5a9fff);
            box-shadow: 0 4px 15px rgba(122, 175, 255, 0.4);
        }

        .indicator-student {
            transform: translateX(-100%);
            background: linear-gradient(135deg, #a78bfa, #8b5cf6);
            box-shadow: 0 4px 15px rgba(167, 139, 250, 0.4);
        }

        .tab-button {
            transition: color 0.4s ease, transform 0.1s ease;
        }

        .tab-button:active {
            transform: scale(0.95);
        }

        @keyframes animate-fade-in {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: animate-fade-in 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center py-6 sm:py-12 px-4 sm:px-6 text-white font-sans">
    <!-- Ambient Background -->
    <div class="liquid-glass-ambient">
        <div class="orb orb-primary"></div>
        <div class="orb orb-tertiary"></div>
        <div class="orb orb-accent"></div>
    </div>

    <div class="w-full max-w-full sm:max-w-md space-y-6 sm:space-y-8 relative z-10">
        <!-- Logo & Title -->
        <div class="text-center">
            <div class="liquid-glass-icon icon-primary w-20 h-20 sm:w-24 sm:h-24 rounded-[1.5rem] sm:rounded-[1.75rem] mx-auto mb-4 sm:mb-6 shadow-lg shadow-primary/10">
                <span class="material-symbols-outlined text-primary text-4xl sm:text-5xl" style="font-variation-settings: 'FILL' 1;">school</span>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold refractive-text">بوابة الحضور الذكي</h1>
            <p class="text-gray-400 mt-2 sm:mt-3 text-xs sm:text-sm">مرحباً بك، يرجى اختيار نوع الدخول</p>
        </div>

        <!-- Tab Bar -->
        <div class="liquid-glass-tabbar flex gap-2 p-1 rounded-2xl relative">
            <div id="tabIndicator" class="tab-indicator indicator-teacher"></div>
            <button id="teacherTab" onclick="switchTab('teacher')"
                class="tab-button flex-1 py-3.5 rounded-xl font-bold relative z-10 text-on-primary">معلم / مدير</button>
            <button id="studentTab" onclick="switchTab('student')"
                class="tab-button flex-1 py-3.5 rounded-xl font-medium relative z-10 text-gray-400">طالب / ولي أمر</button>
        </div>

        <!-- Forms Container -->
        <div class="liquid-glass-container space-y-4 sm:space-y-6">
            <!-- Teacher Login Form -->
            <div id="teacherForm" class="liquid-glass liquid-glass-prominent rounded-[2rem] p-6 sm:p-8 shadow-2xl space-y-4 sm:space-y-6">
                <div class="space-y-1 sm:space-y-2">
                    <label class="text-xs sm:text-sm font-medium text-gray-300 refractive-text">الرقم الوزاري</label>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-gray-500">badge</span>
                        <input type="text" id="ministryId"
                            class="liquid-glass-input w-full rounded-xl pr-12 py-3 sm:py-3.5 text-xs sm:text-sm"
                            placeholder="أدخل رقمك الوزاري">
                    </div>
                </div>
                <div class="space-y-1 sm:space-y-2">
                    <label class="text-xs sm:text-sm font-medium text-gray-300 refractive-text">كلمة السر</label>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-gray-500">lock</span>
                        <input type="password" id="password"
                            class="liquid-glass-input w-full rounded-xl pr-12 py-3 sm:py-3.5 text-xs sm:text-sm"
                            placeholder="••••••••">
                    </div>
                </div>
                <button onclick="handleLogin()"
                    class="liquid-button liquid-button-prominent w-full py-3.5 sm:py-4 text-on-primary font-bold rounded-2xl text-xs sm:text-sm">دخول
                    النظام</button>
            </div>

            <!-- Student Search Form -->
            <div id="studentForm" class="liquid-glass liquid-glass-prominent rounded-[2rem] p-6 sm:p-8 shadow-2xl space-y-4 sm:space-y-6 hidden">
                <div class="space-y-1 sm:space-y-2">
                    <label class="text-xs sm:text-sm font-medium text-gray-300 refractive-text">رقم الطالب (ID)</label>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-gray-500">person_search</span>
                        <input type="text" id="studentId"
                            class="liquid-glass-input w-full rounded-xl pr-12 py-3 sm:py-3.5 text-xs sm:text-sm"
                            placeholder="مثال: 2024001">
                    </div>
                </div>
                <button onclick="handleStudentSearch()"
                    class="liquid-button liquid-button-prominent w-full py-3.5 sm:py-4 text-on-primary font-bold rounded-2xl text-xs sm:text-sm">عرض
                    حالة الحضور</button>
                <p class="text-[11px] text-center text-gray-500">يمكنك متابعة تقرير الحضور والغياب اليومي وسجل الأيام
                    السابقة.</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="scripts/db.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/ui-utils.js"></script>
    <script>
        function switchTab(type) {
            const tabs = ['teacherTab', 'studentTab'];
            const forms = ['teacherForm', 'studentForm'];
            const indicator = document.getElementById('tabIndicator');

            if (type === 'teacher') {
                indicator.classList.add('indicator-teacher');
                indicator.classList.remove('indicator-student');
            } else {
                indicator.classList.remove('indicator-teacher');
                indicator.classList.add('indicator-student');
            }

            tabs.forEach(t => {
                const el = document.getElementById(t);
                if (t === type + 'Tab') {
                    el.classList.add('text-on-primary', 'font-bold');
                    el.classList.remove('text-gray-400', 'font-medium');
                } else {
                    el.classList.remove('text-on-primary', 'font-bold');
                    el.classList.add('text-gray-400', 'font-medium');
                }
            });

            forms.forEach(f => {
                const formEl = document.getElementById(f);
                if (f === type + 'Form') {
                    formEl.classList.remove('hidden');
                    formEl.classList.add('animate-fade-in');
                } else {
                    formEl.classList.add('hidden');
                }
            });
        }

        async function handleLogin() {
            const mid = document.getElementById('ministryId').value;
            const pass = document.getElementById('password').value;

            const btn = event.currentTarget;
            UI.setLoading(true);
            btn.disabled = true;

            const result = await Auth.login(mid, pass);

            if (result.success) {
                UI.toast('تم الدخول بنجاح', 'success');
                setTimeout(() => {
                    window.location.href = result.user.role === 'admin' ? 'admin.html' : 'teacher.html';
                }, 1000);
            } else {
                UI.setLoading(false);
                btn.disabled = false;
                UI.toast(result.message, 'error');
            }
        }

        async function handleStudentSearch() {
            const sid = document.getElementById('studentId').value;

            const btn = event.currentTarget;
            UI.setLoading(true);
            btn.disabled = true;

            await DB.init();
            const students = await DB.getStudents();
            const student = students.find(s => s.id === sid || s.academicId === sid);

            if (student) {
                UI.toast('تم العثور على الطالب، جاري الانتقال...', 'success');
                setTimeout(() => {
                    window.location.href = 'student.html?id=' + (student.id || sid);
                }, 1000);
            } else {
                UI.setLoading(false);
                btn.disabled = false;
                UI.toast('هذا الرقم غير مسجل في النظام', 'error');
            }
        }
    </script>
</body>

</html>
